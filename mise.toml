[tools]
uv = "0.10.2"

[tasks."unit-test"]
description = "Run unit tests"
run = "uv run pytest"

[tasks.coverage]
description = "Run tests with coverage reporting"
run = "uv run pytest --cov --cov-branch --cov-report=term-missing --cov-report=html"

[tasks.tox]
description = "Run tests across Python versions with tox"
run = "uvx --with tox-uv==1.29.0 tox"

[tasks."type-check"]
description = "Run type checking"
run = "uv run ty check"

[tasks.lint]
description = "Run linters and format checks"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run mdformat *.md --check",
]

[tasks."code-quality-check"]
description = "Run all code quality checks"
depends = ["lint", "type-check"]

[tasks.format]
description = "Auto-fix lint issues and format code"
run = [
  "uv run ruff check --fix",
  "uv run ruff format",
  "uv run mdformat *.md",
]
